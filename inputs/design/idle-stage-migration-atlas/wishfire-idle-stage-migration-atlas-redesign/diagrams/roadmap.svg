<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="roadmap-title roadmap-desc">
<title id="roadmap-title">Six proofs gate the migration</title>
<desc id="roadmap-desc">Each phase ends with a playable proof; P2 is the first go / no-go milestone.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17232D"/></marker></defs>
<rect width="800" height="440" fill="#F7F2E8"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#17232D">Six proofs gate the migration</text>
<text x="28" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">Each phase ends with a playable proof; P2 is the first go / no-go milestone.</text>
<path d="M70,220 L740,220" stroke="#17232D" stroke-width="3" fill="none"/>
<circle cx="90" cy="220" r="23" fill="#00A8B5" stroke="#17232D" stroke-width="2"/>
<text x="90" y="224" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FCFAF5">P0</text>
<text x="90" y="168" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#17232D">CONTRACT</text>
<text x="90" y="275" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">Write state model, timing rules,</text>
<text x="90" y="286" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">reward tables, save migration.</text>
<circle cx="216" cy="220" r="23" fill="#7357B3" stroke="#17232D" stroke-width="2"/>
<text x="216" y="224" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FCFAF5">P1</text>
<text x="216" y="168" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#17232D">STAGE PROOF</text>
<text x="216" y="275" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">1-1 waves &gt; boss &gt; 1-2;</text>
<text x="216" y="286" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">four heroes auto-fight.</text>
<circle cx="342" cy="220" r="23" fill="#B98522" stroke="#17232D" stroke-width="2"/>
<text x="342" y="224" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FCFAF5">P2</text>
<text x="342" y="168" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#17232D">LAMP PROOF</text>
<text x="342" y="275" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">Drop, roll, compare, equip/sell,</text>
<text x="342" y="286" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">CP update, persistence.</text>
<circle cx="468" cy="220" r="23" fill="#2E8B68" stroke="#17232D" stroke-width="2"/>
<text x="468" y="224" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FCFAF5">P3</text>
<text x="468" y="168" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#17232D">RETURN PROOF</text>
<text x="468" y="275" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">Capped offline claim, daily reset,</text>
<text x="468" y="286" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">deterministic replay.</text>
<circle cx="594" cy="220" r="23" fill="#C45262" stroke="#17232D" stroke-width="2"/>
<text x="594" y="224" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FCFAF5">P4</text>
<text x="594" y="168" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#17232D">DEPTH PROOF</text>
<text x="594" y="275" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">Automatic skills, two companions,</text>
<text x="594" y="286" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">one meta track.</text>
<circle cx="720" cy="220" r="23" fill="#DE7A3E" stroke="#17232D" stroke-width="2"/>
<text x="720" y="224" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FCFAF5">P5</text>
<text x="720" y="168" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#17232D">SERVICE PROOF</text>
<text x="720" y="275" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">One event; identity/backend/</text>
<text x="720" y="286" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" text-anchor="middle" fill="#58646D">telemetry decision.</text>
<text x="342" y="345" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#B98522">FIRST GO / NO-GO</text>
</svg>