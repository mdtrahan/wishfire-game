<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="lamp-gear-flow-title lamp-gear-flow-desc">
<title id="lamp-gear-flow-title">One lamp becomes one durable gear decision</title>
<desc id="lamp-gear-flow-desc">A deterministic roll ends in exactly one persisted equip or sell outcome.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17232D"/></marker></defs>
<rect width="800" height="440" fill="#F7F2E8"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#17232D">One lamp becomes one durable gear decision</text>
<text x="28" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">A deterministic roll ends in exactly one persisted equip or sell outcome.</text>
<path d="M145,122.0 L165,122.0" stroke="#17232D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M270,122.0 L290,122.0" stroke="#17232D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M395,122.0 L415,122.0" stroke="#17232D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M540,122.0 H575 V72 H610" stroke="#17232D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M540,122.0 H575 V177 H610" stroke="#17232D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="90" width="105" height="64" fill="#FCFAF5" stroke="#00A8B5" stroke-width="3"/><rect x="40" y="90" width="8" height="64" fill="#00A8B5"/><text x="58" y="117" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#17232D">1  EARN</text><text x="58" y="139" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">Wave or boss grants lamps.</text>
<rect x="165" y="90" width="105" height="64" fill="#FCFAF5" stroke="#B98522" stroke-width="3"/><rect x="165" y="90" width="8" height="64" fill="#B98522"/><text x="183" y="117" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#17232D">2  OPEN</text><text x="183" y="139" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">Consume one lamp.</text>
<rect x="290" y="90" width="105" height="64" fill="#FCFAF5" stroke="#7357B3" stroke-width="3"/><rect x="290" y="90" width="8" height="64" fill="#7357B3"/><text x="308" y="117" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#17232D">3  ROLL</text><text x="308" y="139" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">Rarity + slot + affixes.</text>
<rect x="415" y="90" width="125" height="64" fill="#FCFAF5" stroke="#DE7A3E" stroke-width="3"/><rect x="415" y="90" width="8" height="64" fill="#DE7A3E"/><text x="433" y="117" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#17232D">4  COMPARE</text><text x="433" y="139" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">Show CP and stat delta.</text>
<rect x="610" y="40" width="130" height="64" fill="#FCFAF5" stroke="#2E8B68" stroke-width="3"/><rect x="610" y="40" width="8" height="64" fill="#2E8B68"/><text x="628" y="67" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#17232D">5A  EQUIP</text><text x="628" y="89" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">Replace item; recalc CP.</text>
<rect x="610" y="145" width="130" height="64" fill="#FCFAF5" stroke="#C45262" stroke-width="3"/><rect x="610" y="145" width="8" height="64" fill="#C45262"/><text x="628" y="172" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#17232D">5B  SELL</text><text x="628" y="194" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#58646D">Convert to Gold</text>
</svg>