[package]
name = "simulation_core"
version = "0.1.0"
edition = "2021"
description = "Tiny Rust pilot for deterministic Orka simulation formulas."
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wf_combat = { path = "../wf_combat", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
