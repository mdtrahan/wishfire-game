<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-tap-highlight" content="no">
  <title>Web Runner</title>
  <style>
    @font-face{
      font-family:"Bungee";
      font-style:normal;
      font-weight:400;
      font-display:swap;
      src:url("./assets/fonts/Bungee-Regular.ttf") format("truetype");
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;overscroll-behavior:none}
    body{
      position:fixed;
      inset:0;
      font-family:system-ui,Segoe UI,Arial,sans-serif;
      color:#f8fafc;
      touch-action:none;
      -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
    }
    .app-shell{
      width:100vw;
      height:100vh;
      height:100dvh;
      display:grid;
      place-items:center;
      background:#000;
      overflow:hidden;
    }
    canvas{
      display:block;
      border:0;
      background:#000;
      flex:0 0 auto;
      max-width:100vw;
      max-height:100vh;
      max-height:100dvh;
      touch-action:none;
    }
    .dev2-launcher{
      position:fixed;
      top:44px;
      right:10px;
      z-index:10000;
      border:1px solid #334155;
      background:#0f172a;
      color:#f8fafc;
      padding:6px 10px;
      border-radius:999px;
      font:700 11px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      cursor:pointer;
      box-shadow:0 4px 12px rgba(0,0,0,.28);
      touch-action:auto;
    }
    .dev2-diagnostics[hidden]{display:none}
    .dev2-diagnostics{
      position:fixed;
      inset:0;
      z-index:10001;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      background:rgba(0,0,0,.68);
      color:#111827;
      touch-action:auto;
    }
    .dev2-panel{
      width:min(760px,calc(100vw - 32px));
      max-height:88vh;
      max-height:88dvh;
      overflow:auto;
      overscroll-behavior:contain;
      border:1px solid #475569;
      border-radius:8px;
      background:#f8fafc;
      box-shadow:0 18px 48px rgba(0,0,0,.42);
      padding:14px;
      touch-action:auto;
    }
    .dev2-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .dev2-title{font-size:15px;font-weight:800;color:#0f172a}
    .dev2-close{
      border:1px solid #334155;
      background:#fff;
      color:#111827;
      border-radius:8px;
      padding:6px 10px;
      font:700 12px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      cursor:pointer;
    }
    .dev2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .dev2-block{min-width:0}
    .dev2-block h2{margin:0 0 4px;font-size:12px;color:#334155}
    #output,#gem-counter-output,#wallet-output,#astral-wallet-output{
      width:100%;
      min-height:96px;
      max-height:220px;
      margin:0;
      overflow:auto;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      border:1px solid #cbd5e1;
      border-radius:6px;
      background:#fff;
      color:#111827;
      padding:8px;
      font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      touch-action:auto;
    }
    @media (max-width:640px){
      .dev2-grid{grid-template-columns:1fr}
      .dev2-panel{padding:12px}
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-label="Game">
    <canvas id="view" width="360" height="640"></canvas>
  </main>
  <button id="dev2-toggle" class="dev2-launcher" type="button" aria-controls="dev2-diagnostics" aria-expanded="false">DEV2</button>
  <section id="dev2-diagnostics" class="dev2-diagnostics" hidden aria-hidden="true">
    <div class="dev2-panel" role="dialog" aria-modal="true" aria-labelledby="dev2-title">
      <div class="dev2-header">
        <div id="dev2-title" class="dev2-title">Diagnostics</div>
        <button class="dev2-close" type="button" data-dev2-close>Close</button>
      </div>
      <div class="dev2-grid">
        <section class="dev2-block" aria-label="Runtime output">
          <h2>Runtime</h2>
          <pre id="output">Loading...</pre>
        </section>
        <section class="dev2-block" aria-label="Astral wallet output">
          <h2>Astral Wallet</h2>
          <pre id="astral-wallet-output">Astral Flow Wallet: loading...</pre>
        </section>
        <section class="dev2-block" aria-label="Gem counter output">
          <h2>Gem Counter</h2>
          <pre id="gem-counter-output">Gem Counter Radiator: loading...</pre>
        </section>
        <section class="dev2-block" aria-label="Wallet output">
          <h2>Wallet</h2>
          <pre id="wallet-output">Wallet: loading...</pre>
        </section>
      </div>
    </div>
  </section>
  <script>
    (function() {
      const out = document.getElementById('output');
      const panel = document.getElementById('dev2-diagnostics');
      const toggle = document.getElementById('dev2-toggle');
      const close = document.querySelector('[data-dev2-close]');
      function setDiagnosticsOpen(open) {
        if (!panel || !toggle) return;
        const nextOpen = !!open;
        const changed = diagnosticsOpen() !== nextOpen;
        panel.hidden = !nextOpen;
        panel.setAttribute('aria-hidden', String(!nextOpen));
        toggle.setAttribute('aria-expanded', String(nextOpen));
        if (nextOpen) {
          const closeButton = panel.querySelector('[data-dev2-close]');
          if (closeButton) closeButton.focus();
        } else {
          toggle.focus();
        }
        if (changed) {
          window.dispatchEvent(new CustomEvent('orka:dev2-diagnostics-open-change', { detail: { open } }));
        }
      }
      function diagnosticsOpen() {
        return !!panel && !panel.hidden;
      }
      function isEditableTarget(target) {
        const tag = String(target && target.tagName || '').toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      }
      function isDev2Hotkey(ev) {
        const key = String(ev.key || '').toLowerCase();
        const code = String(ev.code || '');
        return !!((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (key === 'd' || code === 'KeyD'));
      }
      function show(msg) {
        if (out) out.textContent = msg;
      }
      if (toggle) toggle.addEventListener('click', () => setDiagnosticsOpen(!diagnosticsOpen()));
      if (close) close.addEventListener('click', () => setDiagnosticsOpen(false));
      if (panel) {
        panel.addEventListener('click', (ev) => {
          if (ev.target === panel) setDiagnosticsOpen(false);
        });
      }
      window.__orkaDev2Diagnostics = {
        open: () => setDiagnosticsOpen(true),
        close: () => setDiagnosticsOpen(false),
        toggle: () => setDiagnosticsOpen(!diagnosticsOpen()),
      };
      window.addEventListener('keydown', (ev) => {
        if (isDev2Hotkey(ev)) {
          setDiagnosticsOpen(!diagnosticsOpen());
          ev.preventDefault();
          ev.stopImmediatePropagation();
          return;
        }
        if (!diagnosticsOpen()) return;
        if (ev.key === 'Escape') {
          setDiagnosticsOpen(false);
          ev.preventDefault();
          ev.stopImmediatePropagation();
          return;
        }
        if (!isEditableTarget(ev.target)) {
          ev.preventDefault();
          ev.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', (e) => {
        show('⚠️ Script error\\n' + (e.message || e.error || e));
        setDiagnosticsOpen(true);
      });
      window.addEventListener('unhandledrejection', (e) => {
        show('⚠️ Unhandled rejection\\n' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
        setDiagnosticsOpen(true);
      });
    })();
  </script>
  <script src="./runtime-fingerprint.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
