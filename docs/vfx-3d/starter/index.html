<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portable PS1 spell starter</title>
<style>
  :root { color-scheme:light; font:14px/1.4 system-ui,sans-serif; color:#343028; background:#faf8f2 }
  body { margin:20px auto; max-width:720px; padding:0 12px }
  h1 { font-size:20px; margin:0 0 8px }
  #stage { position:relative; width:min(360px,100%); aspect-ratio:9/16; background:#dbc69d }
  #stage canvas { display:block; width:100%; height:100%; image-rendering:pixelated }
  #seedLabel { position:absolute; top:12px; left:12px; color:#514229; font:12px monospace }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:12px 0 }
  button,input { font:inherit; padding:6px }
  button[aria-pressed=true] { background:#ead8ac }
  :focus-visible { outline:3px solid #654fc1; outline-offset:2px }
  #seed { width:115px } #scrub { width:210px; max-width:70% }
  #error { color:#9a2424 }
</style>
<h1>PS1 spell starter</h1>
<p>Placeholder actors · tiny comet example · native device pixels / PS1 on</p>
<div id="stage"><output id="seedLabel"></output></div>
<div class="controls">
  <button id="recast">Recast</button><button id="play">Pause</button>
  <button data-speed="1" aria-pressed="true">1×</button>
  <button data-speed="0.5" aria-pressed="false">0.5×</button>
  <label>Seed <input id="seed" type="number" min="0" max="4294967295" step="1" value="91731"></label>
  <button id="replay">Replay seed</button>
</div>
<label>Time <input id="scrub" type="range" min="0" max="2.2" step="0.001" value="0"></label>
<output id="clock">0.000 s</output>
<p id="error" role="alert" hidden></p>
<noscript>Enable JavaScript to run the starter. Review galleries generated by capture.cjs work without JavaScript.</noscript>
<script src="vendor/three.min.js"></script>
<script src="helpers.js"></script>
<script src="app.js"></script>
</html>
