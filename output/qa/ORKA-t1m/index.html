<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wishfire puppet motion pilot</title>
<style>body{margin:20px;font:16px system-ui;background:#f4f4ed;color:#172225}button,select{font:inherit;padding:8px}canvas{display:block;max-width:100%;background:#e9eee2;border:1px solid #87968c;margin:16px 0}label{margin-right:12px}p{max-width:680px}</style>
<h1>Puppet motion pilot</h1><p>Fara and Gobloc at 56 logical pixels, followed by enlarged joint inspection. Ground marks show the shared foot origin. Opposite views mirror the source costume.</p>
<label>State <select id="state"><option>idle</option><option>walk</option><option>basic</option><option>cast</option><option>hurt</option><option>ko</option><option>spawn</option></select></label><button id="pause">Pause</button><button id="restart">Restart clip</button><button id="midpoint">Inspect peak</button><span id="clock"></span>
<canvas id="preview" width="960" height="470" aria-label="Animated Fara and Gobloc puppet preview"></canvas><h2>Frame contact sequence</h2><canvas id="contact" width="960" height="440" aria-label="Selected clip frame contact sequence"></canvas><p id="status" role="status">Loading clips…</p>
<script type="module">
import {createActorClipLoader,sampleActorClip} from '../../../web-runner/systems/actorClipPlayback.mjs';
const base='../../../web-runner/assets/puppets/';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const load=createActorClipLoader({loadManifest:()=>fetch(base+'manifest.json').then(r=>r.json()),loadImage:url=>new Promise(resolve=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>resolve(null);image.src=url}),frameUrl:name=>base+name});
let clips=[],age=0,last=performance.now(),paused=false;
async function change(){age=0;const state=document.querySelector('select').value;clips=await Promise.all(['fara','gobloc'].flatMap(actor=>['left','right'].map(async facing=>({actor,facing,clip:await load(actor,state,facing)}))));drawContact();document.querySelector('#status').textContent=clips.every(c=>c.clip)?'All four views loaded. Clips use this preview clock; the game supplies simulation time.':'Missing clip export.';}
document.querySelector('select').onchange=change;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause'};document.querySelector('#restart').onclick=()=>{age=0};document.querySelector('#midpoint').onclick=()=>{paused=true;age=clips[0]?.clip?.impactTimeMs??clips[0]?.clip?.releaseTimeMs??(clips[0]?.clip?.durationMs||0)/2;document.querySelector('#pause').textContent='Resume'};
function drawContact(){const contact=document.querySelector('#contact'),c=contact.getContext('2d');c.clearRect(0,0,960,440);clips.forEach(({actor,facing,clip},row)=>{const ground=row*110+90;c.fillStyle='#172225';c.font='14px system-ui';c.fillText(`${actor} ${facing}`,8,row*110+18);clip?.frames.forEach((frame,i)=>{const x=40+i*76,scale=.55;c.strokeStyle='#819386';c.beginPath();c.moveTo(x-35,ground);c.lineTo(x+35,ground);c.stroke();c.drawImage(frame,x-clip.footOrigin.x*scale,ground-clip.footOrigin.y*scale,clip.canvas.width*scale,clip.canvas.height*scale);c.fillStyle='#c54232';c.fillRect(x-1,ground-1,2,2);c.fillStyle='#172225';c.fillText(String(i),x-4,ground+14)})})}
function draw(now){if(!paused)age+=Math.min(50,now-last);last=now;ctx.clearRect(0,0,960,470);clips.forEach(({actor,facing,clip},i)=>{const x=120+i*240;ctx.fillStyle='#172225';ctx.font='16px system-ui';ctx.fillText(`${actor} ${facing}`,x-50,28);for(const[height,ground]of [[56,110],[220,440]]){ctx.strokeStyle='#819386';ctx.beginPath();ctx.moveTo(x-68,ground);ctx.lineTo(x+68,ground);ctx.stroke();const frame=sampleActorClip(clip,age);if(frame){const scale=height/105;ctx.drawImage(frame,x-clip.footOrigin.x*scale,ground-clip.footOrigin.y*scale,clip.canvas.width*scale,clip.canvas.height*scale)}ctx.fillStyle='#c54232';ctx.fillRect(x-2,ground-2,4,4)}});document.querySelector('#clock').textContent=` ${Math.round(age)} ms${paused?' (paused)':''}`;requestAnimationFrame(draw)}
await change();requestAnimationFrame(draw);
</script>
